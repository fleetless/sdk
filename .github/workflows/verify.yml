# The suite on every push and every pull request, and the same file a release
# calls: a release is never verified by a different pipeline than a push. The
# release passes the commit it is about to publish and that commit's version.
#
# Hosted runners, because this repository is public — a pull request is a
# stranger's code, and hosted minutes are free here.
name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  # The release calls this file on the commit it is about to publish, with
  # that commit's version: this run packs the tarball npm receives.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      version:
        description: X.Y.Z (a release), or X.Y.Z-next.N (a pre-release)
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          # The whole history, not the action's default of one commit.
          # `verify-commit-messages.mjs` is handed `before..sha` and checks
          # that `before` resolves before using it. A depth-1 clone does not
          # have that object, so the check does not fail — it falls through to
          # `sha~1..sha`, which a depth-1 clone does not have either, and then
          # to the tip alone: one commit read, exit 0, green. A guard that
          # quietly narrows what it looked at is worse than one that breaks.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          # v5 caches for the package manager named in package.json by
          # default, and runs pnpm to work out the cache key — one step
          # before corepack installs pnpm. Measured: "Unable to locate
          # executable file: pnpm". v4, which this replaces, cached nothing
          # unless asked; neither does this.
          package-manager-cache: false
      - run: corepack enable && corepack prepare pnpm@11.20.0 --activate
      - run: pnpm install --frozen-lockfile
      # First, and deliberately, on a release call: the cheapest check
      # guarding a release. It writes `dist-tag.env`, the only thing telling
      # publish whether this goes out as `latest` or as `next`. A release's
      # version is already in package.json (the release PR wrote it), and
      # verify-version-tag.mjs checks it. A pre-release's version exists
      # nowhere but here: it is set in this job's package.json, before the
      # pack, and goes to `next`. On a push or a pull request there is nothing
      # to publish, and the file says so in a comment — `eval` of it leaves
      # DIST_TAG unset, and publish refuses by name rather than guessing.
      #
      # `>`, never `| tee`: a pipe would hand this step the pipe's exit
      # status instead of the check's. The version comes in through env, not
      # pasted into the script.
      - name: the release's version (release calls only)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo '# not a release run: nothing to publish' > dist-tag.env
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-next\.[0-9]+$ ]]; then
            npm pkg set version="$VERSION"
            echo 'DIST_TAG=next' > dist-tag.env
          else
            node scripts/verify-version-tag.mjs "v$VERSION" > dist-tag.env
          fi
          cat dist-tag.env
      # Which commits this run is about; the script checks their messages for
      # anything internal. The variable names are historical — what the CI
      # system this moved off called them — and the script still reads them.
      #
      # It takes `before..sha` only when `before` resolves, and lands
      # somewhere different in each of the three cases:
      #
      # - **branch push** — `github.event.before` is the previous tip, so the
      #   range is exactly what this push added.
      # - **release call** — the event (`workflow_dispatch`) carries no
      #   `before`, which the script reads as "no before-sha". It falls back
      #   to `ref~1..ref`: the one commit being released, because a release
      #   names a commit and not a range.
      # - **pull request** — the event carries no `before` at all either, so
      #   the same fallback applies, but `github.sha` here is GitHub's
      #   synthetic merge commit. Its first parent is the base tip, so
      #   `sha~1..sha` is that merge plus every commit the pull request
      #   proposes. Wider than the release case, and the right width: a
      #   fork's commits are exactly what nobody has read yet.
      #
      # The script prints the range and the count it settled on, so a run that
      # read one commit cannot look like a run that read twenty.
      - run: pnpm run verify:commits
        env:
          CI_COMMIT_BEFORE_SHA: ${{ github.event.before }}
          CI_COMMIT_SHA: ${{ inputs.ref || github.sha }}
      - run: pnpm typecheck
      - run: pnpm test
      # The release logic's own tests, the shared list every copy must pass.
      - run: node --test '.github/release/*.test.mjs'
      - run: pnpm build
      - run: pnpm run test:pack
      # The bytes a release publishes, packed here and never again. `npm pack`
      # runs `prepare` (tsup) itself, so the tarball is built from this tree
      # rather than from whatever `pnpm build` happened to leave behind — and
      # the publish job uploads this file instead of rebuilding, so nothing
      # can differ between what was checked and what ships.
      - run: npm pack --pack-destination .
      # How the tarball reaches publish: that job downloads this artifact.
      # It also checks the repository out, but only for release.mjs —
      # nothing there is rebuilt from it.
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          # Fail here, where the pack did. Warning instead would send an empty
          # artifact on to publish, which notices after the tag exists and
          # blames a missing tarball rather than the step that failed to make
          # one.
          if-no-files-found: error
          path: |
            fleetless-sdk-*.tgz
            dist-tag.env
