# Release: this repository's `main`, as the next version, on npm (the
# per-repository release design of 2026-09-23, in fleetless/fleetless). The
# file name is part of npm's trusted-publishing binding: rename it and
# publishing stops until npm is told.
#
# Press "Run workflow" on main. The version comes from the Conventional
# Commits since the last tag (.github/release/release.mjs). A release PR
# turns CHANGELOG.md's "## [Unreleased]" into that version and sets it in
# package.json; the button run turns on GitHub auto-merge for the PR and
# ends. GitHub runs the required `verify` check and merges the PR once it
# passes; that merge starts this workflow again (the `pull_request: closed`
# trigger), which tags the merged commit, verify.yml runs again on it and
# packs the tarball, and exactly that tarball is published — npm never gets
# bytes the suite did not check. A final release goes out under the dist-tag
# `staging`, never `latest`, and the run ends by asking the ops repository to
# record it for staging; `latest` moves, and app-starter is asked to open the
# pull request that pins it, when that release is promoted to production
# (fleetless/fleetless promote.yml).
#
# `prerelease`, from any branch: X.Y.Z-next.N under the dist-tag `next`, for
# a branch elsewhere that must pin this change before it is final. No tag,
# no release PR, no changelog.
#
# A run that failed can be started again: an open release PR is reused and
# rebuilt on the current `main` (auto-merge enabled again), a merged release
# commit is tagged, a tag already on HEAD continues that release, and a
# version npm already lists is never published twice.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: auto, from the commits; an override only raises it
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      prerelease:
        description: publish X.Y.Z-next.N under `next`, from this branch; no tag, no release PR
        type: boolean
        default: false
  # The second half of a release: the App merged the release PR, so this run
  # tags and publishes. A normal pull request closed ends green and does
  # nothing (continuation answers nothing).
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  # Only a release joins the `release` group. Every pull request that closes
  # starts this workflow too, and a run queued in a group cancels the one
  # already pending there: a no-op close must never cancel a pending release.
  group: ${{ (github.event_name != 'pull_request' || (startsWith(github.event.pull_request.head.ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository)) && 'release' || format('release-noop-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tagged: ${{ steps.version.outputs.tagged }}
      continue: ${{ steps.version.outputs.continue }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && 'main' || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The merge that starts this run. `continuation` refuses a
            # release branch from a fork or merged by a person; a normal
            # pull request closed prints nothing and every later job skips.
            version="$(node .github/release/release.mjs continuation --event "$GITHUB_EVENT_PATH")"
            if [ -z "$version" ]; then
              echo "continue=false" >> "$GITHUB_OUTPUT"
              echo "version=" >> "$GITHUB_OUTPUT"
              echo "tagged=false" >> "$GITHUB_OUTPUT"
              echo "a pull request closed; nothing to release"
              exit 0
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "continue=true" >> "$GITHUB_OUTPUT"
            tag="$(node .github/release/release.mjs tag-at-head)"
            if [ -n "$tag" ]; then echo "tagged=true" >> "$GITHUB_OUTPUT"; else echo "tagged=false" >> "$GITHUB_OUTPUT"; fi
            echo "$version continues from the merged release PR"
            exit 0
          fi
          if [ "$PRERELEASE" = true ]; then
            # Assign, then echo: under `set -e`, a command substitution that
            # fails inside `echo` leaves echo's own exit status, which is 0.
            version="$(node .github/release/release.mjs prerelease --package @fleetless/sdk --bump "$BUMP")"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            echo "continue=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "Release runs on main, not $GITHUB_REF (a pre-release runs anywhere)" >&2; exit 1; }
          git fetch -q origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo "main moved after this run started; run it again" >&2; exit 1; }
          tag="$(node .github/release/release.mjs tag-at-head)"
          if [ -n "$tag" ]; then
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "continue=true" >> "$GITHUB_OUTPUT"
            echo "HEAD already carries $tag: continuing that release"
            exit 0
          fi
          version="$(node .github/release/release.mjs next --bump "$BUMP")"
          # Refused here, on a copy, before a branch exists: an empty
          # Unreleased is a published version nobody can read the why of.
          cp CHANGELOG.md "$RUNNER_TEMP/CHANGELOG.md"
          node .github/release/release.mjs rotate --file "$RUNNER_TEMP/CHANGELOG.md" --version "$version" --date "$(date -u +%F)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tagged=false" >> "$GITHUB_OUTPUT"
          echo "continue=true" >> "$GITHUB_OUTPUT"

  release-commit:
    needs: prepare
    if: ${{ needs.prepare.outputs.continue == 'true' && !inputs.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAGGED: ${{ needs.prepare.outputs.tagged }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && 'main' || github.sha }}
          fetch-depth: 0
          # See app-starter's release.yml: a persisted credential would push
          # the branch as github-actions[bot], and no check would ever run.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ secrets.FLEETLESS_APP_ID }}
          private-key: ${{ secrets.FLEETLESS_APP_PRIVATE_KEY }}
          owner: fleetless
          repositories: sdk
          permission-contents: write
          permission-pull-requests: write
          # auto-merge reads the release PR's check runs, and check-passed
          # reads them again before the continuation tags.
          permission-checks: read
      - name: the release commit, through a pull request
        id: commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The continuation: the merge already happened, so the release
            # commit is on main. Belt and braces before the tag: the merged
            # head passed its required check.
            commit="$(node .github/release/release.mjs release-commit --version "$VERSION")"
            if [ -z "$commit" ]; then
              echo "the merged release commit for $VERSION is not on main" >&2; exit 1
            fi
            node .github/release/release.mjs check-passed --sha "$PR_HEAD_SHA" --check verify
            echo "commit=$commit" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$TAGGED" = true ]; then
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0
          fi
          merged="$(node .github/release/release.mjs release-commit --version "$VERSION")"
          if [ -n "$merged" ]; then
            echo "commit=$merged" >> "$GITHUB_OUTPUT"; exit 0
          fi
          branch="release/$VERSION"
          # Past the two early exits the branch is rebuilt every time on this
          # job's HEAD, which is current main. A failed run leaves a release PR
          # that main soon moves past, or one carrying a red check, and
          # auto-merge refuses both for ever -- reusing such a PR untouched
          # makes every later run fail the same way. The force-push puts it
          # back on today's main and restarts its required check.
          git switch -q -c "$branch"
          node .github/release/release.mjs rotate --file CHANGELOG.md --version "$VERSION" --date "$(date -u +%F)"
          npm pkg set version="$VERSION"
          git -c user.name="fleetless-release[bot]" -c user.email="fleetless-release[bot]@users.noreply.github.com" \
            commit -q -am "chore(release): $VERSION"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push -q --force origin "HEAD:refs/heads/$branch"
          # Without --find-only this answers the open PR's number when there is
          # one, and opens a PR when there is not.
          number="$(node .github/release/release.mjs release-pr --version "$VERSION" --branch "$branch")"
          echo "release PR #$number"
          # Auto-merge ends this run at the open PR: no job waits for the
          # check any more. The merge starts this workflow again.
          outcome="$(node .github/release/release.mjs auto-merge --number "$number")"
          if [ "$outcome" = merged ]; then
            commit="$(node .github/release/release.mjs release-commit --version "$VERSION")"
            echo "commit=$commit" >> "$GITHUB_OUTPUT"
          else
            {
              echo "### release PR #$number — $VERSION"
              echo
              echo "Auto-merge $outcome; the release continues when it merges: https://github.com/$GITHUB_REPOSITORY/pull/$number"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    needs: [prepare, release-commit]
    # A pre-release skips release-commit; a skipped need would skip this job
    # too, so the condition says what it means. A release whose button run
    # ended at the open PR has no commit: nothing to verify or publish, and
    # the merge's own continuation run does the rest.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (inputs.prerelease || (needs.release-commit.result == 'success' && needs.release-commit.outputs.commit != '')) }}
    uses: ./.github/workflows/verify.yml
    with:
      # `github.sha` belongs to the pre-release alone, which has no release
      # commit. On a release, `||` would have fallen back to it whenever
      # release-commit produced nothing -- verifying and publishing the branch
      # tip instead of the merged release commit, silently. The prerelease flag
      # decides which one applies; an empty commit on a release now fails.
      ref: ${{ inputs.prerelease && github.sha || needs.release-commit.outputs.commit }}
      version: ${{ needs.prepare.outputs.version }}

  # **Trusted publishing.** There is no npm token: the job proves who it is
  # with a short-lived OIDC credential, and npm signs a provenance statement
  # linking this version to this commit and this run — shown on the package
  # page, checked by `npm audit signatures`. It needs id-token: write,
  # npm >= 11.5.1, node >= 22.14 and a cloud-hosted runner (self-hosted is
  # not supported), and the publisher is configured on npmjs.com against
  # this repository and this workflow's filename. Renaming this file breaks
  # publishing until the publisher is updated there.
  #
  # That publisher may publish and nothing else: "Allow npm dist-tag" stays
  # off for it on npmjs.com, so no run of this workflow can move `latest`.
  # npm is pinned at >= 11.21.0 all the same, the first version whose trusted
  # publishing covers `npm dist-tag`: it is what the promotion uses, and what
  # this workflow would need if the move ever had to run here.
  publish:
    needs: [prepare, release-commit, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # As in the verify job: `github.sha` is the pre-release's commit, never a
      # release's. A `||` fallback would tag and publish the branch tip if
      # release-commit ever answered nothing.
      COMMIT: ${{ inputs.prerelease && github.sha || needs.release-commit.outputs.commit }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      # The repository for release.mjs only: nothing is built here.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.prerelease && github.sha || needs.release-commit.outputs.commit }}
          path: repo
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          # Nothing to cache: the checkout above is for release.mjs only,
          # and this job publishes the tarball verify already packed. Off
          # rather than left to detection, because the one run that
          # exercises this job is a release, and npm refuses to republish a
          # version.
          package-manager-cache: false
      - name: guard against a missing OIDC token
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "FATAL: no OIDC token in this job. Trusted publishing needs 'permissions: id-token: write'; without it npm would fail deep inside the publish with a credential error." >&2
            exit 1
          fi
      - name: npm new enough for trusted publishing
        run: |
          npm install -g npm@^11.21.0
          node -v
          npm -v
      - uses: actions/create-github-app-token@v3
        id: app
        if: ${{ !inputs.prerelease }}
        with:
          app-id: ${{ secrets.FLEETLESS_APP_ID }}
          private-key: ${{ secrets.FLEETLESS_APP_PRIVATE_KEY }}
          owner: fleetless
          # `fleetless` for the dispatch below: a repository_dispatch needs
          # contents: write on the repository it is sent to. app-starter is
          # no longer asked here — it is asked on promotion instead.
          repositories: sdk,fleetless
          permission-contents: write
      - name: tag
        if: ${{ !inputs.prerelease }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node repo/.github/release/release.mjs create-tag --version "$VERSION" --sha "$COMMIT"
      # No .npmrc and no token: npm reads the job's OIDC credential, and
      # generates the provenance attestation itself for a public package
      # from a public repository. The registry, not npm publish's exit
      # code, is the evidence it landed — npm-wait (release.mjs) polls
      # until the tarball serves, for the two-clock reason its own
      # npmState comment gives.
      - name: publish, unless npm already has it
        id: publish
        run: |
          set -euo pipefail
          eval "$(cat dist-tag.env)"
          if [ -z "${DIST_TAG:-}" ]; then
            echo "FATAL: dist-tag.env from verify carries no DIST_TAG; verify writes one only on a release call." >&2
            exit 1
          fi
          set -- fleetless-sdk-*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "FATAL: expected exactly one packed tarball from verify, found: $*" >&2
            exit 1
          fi
          state="$(node repo/.github/release/release.mjs npm-state --package @fleetless/sdk --version "$VERSION")"
          if [ "$state" = absent ]; then
            echo "publishing $1 to dist-tag $DIST_TAG by trusted publishing"
            npm publish "$1" --access public --tag "$DIST_TAG"
          else
            echo "npm already has @fleetless/sdk@$VERSION ($state): a publish happened, and npm refuses a version twice"
          fi
          node repo/.github/release/release.mjs npm-wait --package @fleetless/sdk --version "$VERSION"
          echo "done=true" >> "$GITHUB_OUTPUT"
      # A final release is on npm under `staging` now and nowhere else. The
      # ops repository records it into the staging manifest
      # (record-release.yml); promote.yml moves `latest` to it when that
      # staging generation is promoted to production, and only then asks
      # app-starter to open the pull request that pins it (sdk-bump.yml). A
      # dispatch is a request: the ops repository checks the tag and the
      # integrity against this repository and npm before it writes anything.
      # A pre-release is nobody's candidate for production and is not
      # recorded.
      - name: ask the ops repository to record it for staging
        id: record
        if: ${{ !inputs.prerelease }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          integrity="$(npm view "@fleetless/sdk@$VERSION" dist.integrity)"
          if [ -z "$integrity" ]; then
            echo "FATAL: npm lists no dist.integrity for @fleetless/sdk@$VERSION; nothing to record." >&2
            exit 1
          fi
          # `-f`, not `-F`: every field is a string, and `-F` would turn a
          # value that looks like a number or a boolean into one.
          gh api repos/fleetless/fleetless/dispatches -f event_type=release \
            -f "client_payload[component]=sdk" -f "client_payload[version]=$VERSION" \
            -f "client_payload[commit]=$COMMIT" -f "client_payload[integrity]=$integrity" \
            -f "client_payload[run_url]=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "done=true" >> "$GITHUB_OUTPUT"
      - name: summary
        if: always()
        env:
          # The summary runs under `if: always()`, so it reports what the steps
          # before it reached rather than asserting it. The three states are
          # genuinely different: nothing published, published but staging does
          # not know it (which a person then has to dispatch), and both.
          PUBLISHED: ${{ steps.publish.outputs.done }}
          RECORDED: ${{ steps.record.outputs.done }}
        run: |
          {
            echo "### @fleetless/sdk $VERSION — ${{ job.status }}"
            echo
            echo "- commit: \`$COMMIT\`"
            if [ "$PUBLISHED" != true ]; then
              echo "- not on npm: the run did not finish the publish step"
            elif [ "$PRERELEASE" = true ]; then
              echo "- a pre-release under \`next\`: no tag, no changelog entry"
            else
              echo "- tag v$VERSION, on npm under \`staging\`; \`latest\` moves, and app-starter is asked to pin it, when it is promoted to production (fleetless/fleetless promote.yml)"
              if [ "$RECORDED" = true ]; then
                echo "- dispatched \`release\` to fleetless/fleetless: record-release.yml records it into staging"
              else
                echo "- NOT dispatched to fleetless/fleetless: staging does not know this version. Run Release again; npm is not published to twice"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
